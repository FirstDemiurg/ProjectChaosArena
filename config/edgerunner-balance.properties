# Edgerunner Balance for Project: Edgerunner 1.2.0
# Restart the game or dedicated server after changing these settings.
# In multiplayer, edit this file on the server and install the addon on both sides.
#
# Loss over time. 0.5 = half speed, 2 = double speed, 0 = no gradual loss.
# Recovery and the immediate first stage for overload follow Edgerunner rules.
humanityLossMultiplier=25.0

# Applies to base load and to all upgrade increments. 0 = zero load.
implantLoadMultiplier=4.0

# Optional maximum load for a fully upgraded implant.
# A per-implant maximum replaces the global multiplier for that implant.
