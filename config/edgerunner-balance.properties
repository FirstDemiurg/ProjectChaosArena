# Blood Pump per charge, in HP (2 HP = 1 heart).
# Tier 2 is the base implant. Tiers 3-5 are the three upgrades for each branch.
# regenTotal is spread over 6 seconds. Set a value to 0 to disable that part.
bloodPump.instantHeal.2=2
bloodPump.regenTotal.2=1
bloodPump.instantHeal.3=3
bloodPump.regenTotal.3=2
bloodPump.instantHeal.4=4
bloodPump.regenTotal.4=3
bloodPump.instantHeal.5=5
bloodPump.regenTotal.5=4

# Enable Edgerunner dreams, nightmares and the Moon disc dream sequence.
dreamsEnabled=false

# Multiplier for target pressure, which is capped at 1000.
pressureMultiplier=3.0

# Speed at which pressure rises toward its target. 0 freezes rises.
pressureRiseMultiplier=1.0

# Speed at which pressure falls toward its target. 0 freezes falls.
pressureFallMultiplier=1.0

# Multiplier for gradual humanity recovery. 0 disables gradual recovery.
humanityRecoveryMultiplier=9.0

# Duration of the immunosuppression effect per dose, in seconds. Minimum 0.05 s (1 tick).
immunosuppressantDurationSeconds=120

# Mantis Blades combo tempo and attack speed (0.1 to 5).
mantis.attackSpeedMultiplier=0.3

# Mantis Blades melee and leap damage. Includes existing damage upgrades.
mantis.damageMultiplier=0.5

# Mantis Blades random chance to apply bleed. A successful leap still applies bleed.
mantis.bleedChanceMultiplier=1.0

# Mantis Leap range, including the Jailbreak upgrade (0.1 to 3).
mantis.leapRangeMultiplier=1.0

# Mantis Leap cooldown. 2 doubles the wait.
mantis.leapCooldownMultiplier=3.0

# Gorilla Arms attack speed and vanilla combo tempo (0.1 to 5).
gorilla.attackSpeedMultiplier=1.0

# Gorilla Arms direct impacts while deployed, including Hydraulic Blow and Slam.
gorilla.damageMultiplier=0.7

# Vanilla Gorilla Arms guard damage reduction. Capped at 100 percent.
gorilla.guardStrengthMultiplier=1.0

# Gorilla Arms Fury earned from attacks and guards.
gorilla.furyGainMultiplier=1.0
