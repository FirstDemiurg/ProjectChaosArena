
#Bastion Turrets: weapon stats. Each value starts at the mod's own number ("Mod default" in its comment).
#  Left at that number, the weapon stays as the mod (or a datapack in data/bastion/turret_weapons) makes it.
#  Any other number replaces it. A number out of range, or text in quotes, is reset to the mod's number (see the log).
#Times are in ticks (20 ticks = 1 second), distances in blocks, angles in degrees.
#A stat a weapon does not use (for example spread on the Tesla Coil) has no effect.
#Saving this file while the game runs applies it at once. On a server, the server's copy of this file counts.
#Gun Turret
[gun]
	#Targeting range in blocks.
	#Mod default: 32
	#Range: 0.5 ~ 256
	range = 32
	#Ticks between shots (lower = faster).
	#Mod default: 12
	#Range: 0.5 ~ 12000
	fire_interval = 12
	#Damage per hit.
	#Mod default: 7
	#Range: 0 ~ 10000
	damage = 7
	#Inaccuracy in degrees.
	#Mod default: 0.3
	#Range: 0 ~ 90
	spread = 0.3
	#Ammo items used per shot (0.5 = one item every two shots; a shot never takes more than one).
	#Mod default: 1
	#Range: 0 ~ 1
	ammo_per_shot = 1
	#Degrees the weapon turns per tick.
	#Mod default: 9
	#Range: 0 ~ 180
	turn_speed = 9
	#Degrees off target it still fires at.
	#Mod default: 1.5
	#Range: 0 ~ 180
	aim_tolerance = 1.5
	#Ticks it must stay on target before its first shot.
	#Mod default: 3
	#Range: 0 ~ 200
	aim_lock_ticks = 3
	#Lowest barrel angle in degrees (negative = down).
	#Mod default: -35
	#Range: -90 ~ 90
	min_pitch = -35
	#Highest barrel angle in degrees.
	#Mod default: 90
	#Range: -90 ~ 90
	max_pitch = 90
	#Degrees off aim it keeps firing while a burst swings to the next target (0 = aim_tolerance).
	#Mod default: 0
	#Range: 0 ~ 180
	sweep_tolerance = 0
	#Heat added per shot (0 = never overheats).
	#Mod default: 0
	#Range: 0 ~ 1000
	heat_per_shot = 0
	#Heat lost per second.
	#Mod default: 0
	#Range: 0 ~ 100000
	heat_dissipation_per_second = 0
	#Heat at which it overheats.
	#Mod default: 100
	#Range: 1 ~ 3000
	max_heat = 100
	#Ticks it stays locked after overheating.
	#Mod default: 60
	#Range: 0 ~ 12000
	overheat_ticks = 60
	#Bullet speed in blocks per tick.
	#Mod default: 6
	#Range: 0.01 ~ 100
	bullet_speed = 6
	#Damage multiplier on a headshot.
	#Mod default: 1.5
	#Range: 0 ~ 100
	headshot_multiplier = 1.5
	#How well it aims ahead of moving targets (0 = not at all, 1 = perfectly).
	#Mod default: 0.9
	#Range: 0 ~ 1
	lead_accuracy = 0.9
	#Damage multiplier of the shot after holding a target for precision_lock_ticks.
	#Mod default: 1.5
	#Range: 0 ~ 100
	precision_lock_multiplier = 1.5
	#Ticks on one target before the precision shot.
	#Mod default: 20
	#Range: 0 ~ 12000
	precision_lock_ticks = 20

