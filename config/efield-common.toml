
["comgrafield Performance Settings"]
	#耦合双力场的作用半径 默认16
	#Range: 1 ~ 64
	shieldRadius = 16
	#耦合双力场弹开力度 默认2 太大会导致实体瞬间消失
	#Range: 0.1 ~ 10.0
	pushStrength = 2.0
	#耦合双力场每次防御拦截消耗的 FE 默认16k
	#Range: 0 ~ 512000000
	energyPerDeflect = 16000
	#耦合双力场，虚空代理，强制波动装甲的最大能量存储容量 默认512k 修改要重放方块才能应用
	#Range: > 1000
	maxCapacity = 512000
	#耦合双力场，虚空代理，强制波动装甲每tick维持开启的基础消耗 默认90
	#Range: 0 ~ 512000000
	idleDrain = 90
	#耦合双力场，虚空代理，强制波动装甲启动所需的预热时间 (Tick),默认160
	#Range: 1 ~ 12000
	startupDelay = 160
	#偏折盾启动时间.
	#Range: 1 ~ 12000
	efieldStartupDelay = 20
	#天穹守护启动时间.
	#Range: 1 ~ 12000
	celestialAegisStartupDelay = 1200
	#偏折盾的防护半径.
	#Range: 1 ~ 64
	efieldShieldRadius = 8
	#天穹守护的防护半径 大于64可能出现未加载而无法防护.
	#Range: 1 ~ 256
	celestialAegisShieldRadius = 64
	#虚空代理的能量消耗系数 能耗=弹射物速度*半径*系数
	#Range: 0.0 ~ 5.12E8
	voidProxyEnergyCoefficient = 2000.0
	#强制波动装甲能耗系数 能耗=弹射物速度*系数
	#Range: 0.0 ~ 5.12E8
	kleinFieldEnergyCoefficient = 2000.0
	#强制波动装甲的自动散热程度
	#Range: 0 ~ 512000000
	kleinFieldOverHalfDrain = 20

["自动修复系统相关"]
	#最大可选区域 过大可能导致卡顿与崩溃.
	#Range: 1 ~ 256
	nemeRepairMaxSize = 128
	#单个方块内最大存储的能量.
	#Range: > 1000
	nemeRepairEnergyCapacity = 64000
	#每个tick将要消耗的能量.
	#Range: 0 ~ 512000000
	nemeRepairIdleDrain = 20
	#定义了多少tick进行一次修复.
	#Range: 1 ~ 12000
	nemeRepairCheckInterval = 20
	#决定是否存储方块实体 默认启用.
	nemeRepairPreserveBlockEntityData = true

["再生船体核心相关"]
	#再生船体核心的最大能量存储，默认64kFE。
	#Range: > 1000
	regenerativeHullCoreEnergyCapacity = 64000
	#再生船体核心每填充一个方块消耗的能量，默认16kFE。
	#Range: 0 ~ 512000000
	regenerativeHullCorePlaceCost = 16000
	#再生船体核心扫描并尝试填充一次的间隔tick，默认4tick。
	#Range: 1 ~ 12000
	regenerativeHullCoreInterval = 4

