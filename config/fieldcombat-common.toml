#Respect server.properties pvp and scoreboard teams as well
allowPvP = true
#Range: 0.01 ~ 10.0
damageScale = 0.7
#Range: 0.01 ~ 10.0
healthScale = 0.45
#Fallback XP per point of damage when the target-specific rate is negative.
#Range: 0.0 ~ 100.0
experiencePerDamage = 80.0
#Range: 0 ~ 100000
mobKillExperience = 1200
#Range: 0 ~ 100000
playerKillExperience = 2400
#XP per point of damage to non-player targets. Negative values use experiencePerDamage. 0 disables this reward.
#Range: -1.0 ~ 100.0
experiencePerDamageToMobs = -0.5
#XP per point of damage to players. Negative values use experiencePerDamage. 0 disables this reward.
#Range: -1.0 ~ 100.0
experiencePerDamageToPlayers = -1.0

[statConversion]
	#Minecraft max health = Cobblemon HP × this coefficient
	#Range: 0.01 ~ 10.0
	hpToMinecraftHealth = 0.8
	#Physical damage multiplier per native Attack point
	#Range: 0.01 ~ 10.0
	attackToDamage = 0.1
	#Special damage multiplier per native Special Attack point
	#Range: 0.01 ~ 10.0
	specialAttackToDamage = 0.1
	#Physical mitigation uses native Defense × this coefficient
	#Range: 0.01 ~ 10.0
	defenseToResistance = 0.7
	#Magic mitigation uses native Special Defense × this coefficient
	#Range: 0.01 ~ 10.0
	specialDefenseToResistance = 0.7
	#Native Speed influence on cooldown; 1 preserves current formula
	#Range: 0.0 ~ 5.0
	speedToCooldown = 1.0
	#Native Speed bonus to movement speed per point above 50
	#Range: 0.0 ~ 0.02
	speedToMovement = 5.0E-4

