[killExperience]
	#Kill bonus = base kill XP * multiplier * coefficient for the Pokemon's current level. Base kill XP: mobKillExperience for mobs, playerKillExperience for players. Damage XP is unchanged.
	#Range: 0.0 ~ 1000000.0
